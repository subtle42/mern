# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

env:
  NODE_VER: 26

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VER }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}
          cache: 'npm'
      - name: Running install
        run: npm ci
      - name: Running build
        run: npm run build
      - name: Running tests
        run: npm run test:pipeline
      - name: Publish JUnit Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: '**/junit.xml'
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-artifacts
          path: |
            server/static/
            server/swagger.json
  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
          - chrome
          - msedge
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: static-artifacts
          path: server
      - name: Use Node.js ${{ env.NODE_VER }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}
          cache: 'npm'
      - name: Running install
        run: npm ci
      - name: Installing driver
        run: npx playwright install --no-progress ${{matrix.browser}}
      - name: Install e2e dependencies
        run: npx --yes playwright install-deps > /dev/null 2>&1
      - name: Starting server
        run: npm start -w server &
      - name: Wait for app to respond
        run: npx wait-on http://localhost:3333/documentation/yaml -t 60000
      - name: Running tests
        run: CI=true npm run e2e -w e2e -- --project ${{matrix.browser}}
  vulnerability-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VER }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}
          cache: 'npm'
      - name: Run dependency audit
        run: npm audit --audit-level=high
